<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
<title>CRT Journal</title>
<script src="https://accounts.google.com/gsi/client" async defer></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.0/chart.umd.min.js"></script>
<style>
  :root{
    --bg:#0A0E14;
    --bg-alt:#0E141C;
    --panel:#131A24;
    --panel-2:#182130;
    --border:#232E3D;
    --border-soft:#1A2330;
    --text:#DCE3EC;
    --muted:#748094;
    --muted-2:#4E5A6E;
    --amber:#E3A94A;
    --amber-dim:#8A6A32;
    --long:#3FBF7F;
    --long-dim:#1E3B2E;
    --short:#E1596B;
    --short-dim:#3B2027;
    --mono: 'IBM Plex Mono', 'SFMono-Regular', Consolas, monospace;
    --sans: 'Space Grotesk', 'Inter', -apple-system, sans-serif;
    --body: 'Inter', -apple-system, sans-serif;
  }
  @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500;600&family=Inter:wght@400;500;600&display=swap');

  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;}
  body{
    background:
      radial-gradient(ellipse 900px 500px at 15% -10%, rgba(227,169,74,0.06), transparent 60%),
      var(--bg);
    color:var(--text);
    font-family:var(--body);
    min-height:100vh;
    -webkit-font-smoothing:antialiased;
  }
  ::selection{background:var(--amber-dim); color:#fff;}
  a{color:inherit;}
  button{font-family:var(--sans); cursor:pointer;}
  input,select,textarea{font-family:var(--body);}

  /* ---------- Layout shell ---------- */
  .app{max-width:1180px; margin:0 auto; padding:18px 16px 60px;}
  .topbar{
    display:flex; align-items:center; justify-content:space-between;
    padding:6px 2px 18px; border-bottom:1px solid var(--border-soft); margin-bottom:18px;
    gap:12px; flex-wrap:wrap;
  }
  .brand{display:flex; align-items:center; gap:10px;}
  .brand-mark{width:26px; height:26px; flex:none;}
  .brand-text{font-family:var(--sans); font-weight:700; font-size:17px; letter-spacing:0.2px;}
  .brand-text .sub{display:block; font-family:var(--mono); font-weight:400; font-size:10.5px; color:var(--muted); letter-spacing:1.2px; text-transform:uppercase; margin-top:1px;}
  .sync-pill{
    display:flex; align-items:center; gap:7px; font-family:var(--mono); font-size:11.5px; color:var(--muted);
    padding:6px 11px; border:1px solid var(--border); border-radius:100px; background:var(--panel);
  }
  .dot{width:7px; height:7px; border-radius:50%; background:var(--muted-2); flex:none;}
  .dot.on{background:var(--long); box-shadow:0 0 8px rgba(63,191,127,0.7);}
  .dot.off{background:var(--short);}
  .btn{
    border-radius:8px; border:1px solid var(--border); background:var(--panel-2); color:var(--text);
    padding:8px 14px; font-size:13px; font-weight:500; transition:border-color .15s, background .15s;
  }
  .btn:hover{border-color:var(--amber-dim); background:#1B2534;}
  .btn.primary{background:var(--amber); color:#1A1200; border-color:var(--amber); font-weight:600;}
  .btn.primary:hover{background:#EEB960;}
  .btn.ghost{background:transparent;}
  .btn.small{padding:5px 10px; font-size:12px; border-radius:6px;}
  .btn:disabled{opacity:0.45; cursor:not-allowed;}

  /* ---------- Setup screen ---------- */
  .setup-wrap{max-width:560px; margin:8vh auto 0; padding:0 16px;}
  .setup-card{
    background:var(--panel); border:1px solid var(--border); border-radius:14px; padding:28px 26px;
  }
  .setup-card h1{font-family:var(--sans); font-size:22px; margin:0 0 6px;}
  .setup-card p.lead{color:var(--muted); font-size:13.5px; line-height:1.55; margin:0 0 22px;}
  .field{margin-bottom:16px;}
  .field label{display:block; font-size:12px; color:var(--muted); margin-bottom:6px; font-weight:500;}
  .field input, .field select, .field textarea{
    width:100%; background:var(--bg-alt); border:1px solid var(--border); border-radius:8px;
    padding:10px 12px; color:var(--text); font-size:13.5px; outline:none;
  }
  .field input:focus, .field select:focus, .field textarea:focus{border-color:var(--amber-dim);}
  .field .hint{font-size:11.5px; color:var(--muted-2); margin-top:5px; line-height:1.5;}
  .steps{background:var(--bg-alt); border:1px solid var(--border-soft); border-radius:10px; padding:14px 16px; margin-bottom:20px;}
  .steps summary{cursor:pointer; font-size:13px; font-weight:600; color:var(--amber);}
  .steps ol{margin:12px 0 0; padding-left:18px; font-size:12.5px; color:var(--muted); line-height:1.9;}
  .steps code{background:var(--panel-2); padding:1px 5px; border-radius:4px; font-family:var(--mono); font-size:11.5px; color:var(--text);}
  .steps a{color:var(--amber); text-decoration:underline;}

  /* ---------- Tabs / nav ---------- */
  .nav{display:flex; gap:6px; margin-bottom:18px; overflow-x:auto; padding-bottom:2px;}
  .nav button{
    background:transparent; border:1px solid transparent; color:var(--muted); padding:8px 4px;
    font-size:13.5px; font-weight:600; border-bottom:2px solid transparent; white-space:nowrap;
  }
  .nav button.active{color:var(--text); border-bottom-color:var(--amber);}

  /* ---------- Cards / grid ---------- */
  .grid{display:grid; grid-template-columns:repeat(4,1fr); gap:12px; margin-bottom:18px;}
  @media(max-width:820px){.grid{grid-template-columns:repeat(2,1fr);}}
  .stat{background:var(--panel); border:1px solid var(--border); border-radius:12px; padding:14px 16px;}
  .stat .label{font-size:10.5px; text-transform:uppercase; letter-spacing:0.8px; color:var(--muted); font-weight:600;}
  .stat .value{font-family:var(--mono); font-size:22px; margin-top:6px; font-weight:600;}
  .stat .value.pos{color:var(--long);}
  .stat .value.neg{color:var(--short);}
  .stat .sub{font-size:11px; color:var(--muted-2); margin-top:3px;}

  .panel{background:var(--panel); border:1px solid var(--border); border-radius:12px; padding:18px; margin-bottom:16px;}
  .panel h2{font-family:var(--sans); font-size:14.5px; margin:0 0 14px; font-weight:600; display:flex; align-items:center; justify-content:space-between; gap:10px;}
  .panel h2 .acc-switch select{background:var(--bg-alt); border:1px solid var(--border); color:var(--text); border-radius:7px; padding:5px 9px; font-size:12px;}

  .chart-box{position:relative; height:220px;}
  .two-col{display:grid; grid-template-columns:1.3fr 1fr; gap:16px;}
  @media(max-width:900px){.two-col{grid-template-columns:1fr;}}

  /* ---------- Form ---------- */
  .form-grid{display:grid; grid-template-columns:repeat(4,1fr); gap:12px;}
  @media(max-width:760px){.form-grid{grid-template-columns:repeat(2,1fr);}}
  .form-grid .span2{grid-column:span 2;}
  .form-grid .span4{grid-column:1/-1;}
  .seg{display:flex; border:1px solid var(--border); border-radius:8px; overflow:hidden;}
  .seg button{flex:1; background:var(--bg-alt); border:none; color:var(--muted); padding:9px 6px; font-size:12.5px; font-weight:600; border-right:1px solid var(--border);}
  .seg button:last-child{border-right:none;}
  .seg button.on.long{background:var(--long-dim); color:var(--long);}
  .seg button.on.short{background:var(--short-dim); color:var(--short);}
  .chip-row{display:flex; flex-wrap:wrap; gap:6px;}
  .chip{
    padding:6px 11px; border-radius:100px; border:1px solid var(--border); background:var(--bg-alt);
    color:var(--muted); font-size:12px; font-weight:500;
  }
  .chip.on{border-color:var(--amber-dim); background:rgba(227,169,74,0.12); color:var(--amber);}

  /* ---------- Table ---------- */
  .table-wrap{overflow-x:auto;}
  table{width:100%; border-collapse:collapse; font-size:12.5px; min-width:760px;}
  th{
    text-align:left; padding:9px 10px; color:var(--muted); font-weight:600; font-size:10.5px;
    text-transform:uppercase; letter-spacing:0.5px; border-bottom:1px solid var(--border); white-space:nowrap;
  }
  td{padding:9px 10px; border-bottom:1px solid var(--border-soft); white-space:nowrap; font-family:var(--mono);}
  tr.row:hover{background:var(--panel-2); cursor:pointer;}
  .tag{padding:2px 8px; border-radius:6px; font-size:11px; font-weight:600; font-family:var(--body);}
  .tag.win{background:var(--long-dim); color:var(--long);}
  .tag.loss{background:var(--short-dim); color:var(--short);}
  .tag.be{background:var(--panel-2); color:var(--muted);}
  .r-pos{color:var(--long); font-weight:600;}
  .r-neg{color:var(--short); font-weight:600;}
  .empty{text-align:center; color:var(--muted-2); padding:30px 10px; font-size:13px;}

  .toast{
    position:fixed; bottom:18px; left:50%; transform:translateX(-50%); background:var(--panel-2);
    border:1px solid var(--border); padding:10px 18px; border-radius:9px; font-size:13px; z-index:40;
    box-shadow:0 8px 30px rgba(0,0,0,0.4); opacity:0; pointer-events:none; transition:opacity .2s, transform .2s;
  }
  .toast.show{opacity:1; transform:translateX(-50%) translateY(-4px);}
  .toast.err{border-color:var(--short); color:var(--short);}
  .toast.ok{border-color:var(--long); color:var(--long);}

  .hidden{display:none !important;}
  .row-actions{display:flex; gap:6px; margin-top:14px; justify-content:flex-end;}
  .accounts-editor{display:grid; grid-template-columns:1fr; gap:10px;}
  .acc-line{display:grid; grid-template-columns:1.4fr 1fr 1fr 1fr auto; gap:8px; align-items:center;}
  @media(max-width:700px){.acc-line{grid-template-columns:1fr 1fr; grid-auto-rows:auto;}}
  .acc-line input{padding:8px 10px; font-size:12.5px;}
  .acc-line .rm{color:var(--short); background:transparent; border:1px solid var(--border); border-radius:7px; width:32px; height:32px;}
  footer.note{text-align:center; color:var(--muted-2); font-size:11.5px; margin-top:26px;}

  /* ---------- Calendar tab (additive) ---------- */
  .cal-top{display:flex; align-items:center; justify-content:space-between; gap:10px; margin-bottom:16px; flex-wrap:wrap;}
  .cal-nav{display:flex; align-items:center; gap:12px;}
  .cal-nav button{background:var(--panel-2); border:1px solid var(--border); color:var(--text); width:32px; height:32px; border-radius:8px; font-size:14px;}
  .cal-nav h2{font-family:var(--sans); font-size:16.5px; margin:0; min-width:150px; text-align:center;}
  .cal-pill{display:flex; gap:8px; align-items:center;}
  .cal-pill span{font-family:var(--mono); font-size:12.5px; padding:6px 12px; border-radius:100px; border:1px solid var(--border); background:var(--panel-2);}
  .cal-pill .pnl.pos{color:var(--long); border-color:var(--long-dim); background:var(--long-dim);}
  .cal-pill .pnl.neg{color:var(--short); border-color:var(--short-dim); background:var(--short-dim);}
  .cal-layout{display:grid; grid-template-columns:1fr 220px; gap:14px;}
  @media(max-width:860px){.cal-layout{grid-template-columns:1fr;}}
  .cal-grid{display:grid; grid-template-columns:repeat(7,1fr); gap:6px;}
  .cal-daynames{display:grid; grid-template-columns:repeat(7,1fr); gap:6px; margin-bottom:6px;}
  .cal-daynames div{text-align:center; font-size:10px; color:var(--muted); text-transform:uppercase; letter-spacing:0.6px; font-weight:600;}
  .cal-cell{
    background:var(--panel); border:1px solid var(--border); border-radius:9px; padding:8px 8px 10px;
    min-height:78px; position:relative; display:flex; flex-direction:column;
  }
  .cal-cell.empty{background:transparent; border-color:transparent;}
  .cal-cell.has-data.pos{background:var(--long-dim); border-color:rgba(63,191,127,0.25);}
  .cal-cell.has-data.neg{background:var(--short-dim); border-color:rgba(225,89,107,0.25);}
  .cal-cell .daynum{font-family:var(--mono); font-size:11px; color:var(--muted); align-self:flex-end;}
  .cal-cell .cpnl{font-family:var(--mono); font-weight:700; font-size:13px; margin-top:6px;}
  .cal-cell .cpnl.pos{color:var(--long);}
  .cal-cell .cpnl.neg{color:var(--short);}
  .cal-cell .cmeta{font-size:10px; color:var(--muted); margin-top:2px; line-height:1.5;}
  .cal-cell .cdot{width:5px; height:5px; border-radius:50%; margin-top:auto; align-self:center;}
  .cal-cell .cdot.pos{background:var(--long);}
  .cal-cell .cdot.neg{background:var(--short);}
  .week-rail{display:flex; flex-direction:column; gap:6px;}
  @media(max-width:860px){.week-rail{flex-direction:row; overflow-x:auto;}}
  .week-block{background:var(--panel); border:1px solid var(--border); border-radius:10px; padding:10px 12px; flex:none;}
  @media(max-width:860px){.week-block{min-width:150px;}}
  .week-block .wl{font-size:10px; text-transform:uppercase; letter-spacing:0.6px; color:var(--muted); font-weight:600;}
  .week-block .wpnl{font-family:var(--mono); font-weight:700; font-size:15px; margin-top:4px;}
  .week-block .wpnl.pos{color:var(--long);} .week-block .wpnl.neg{color:var(--short);}
  .week-block .wmeta{font-size:10.5px; color:var(--muted-2); margin-top:3px;}
  .banner-grid{display:grid; grid-template-columns:repeat(5,1fr); gap:12px; margin-top:16px;}
  @media(max-width:820px){.banner-grid{grid-template-columns:repeat(2,1fr);}}
</style>
</head>
<body>

<div id="app" class="app"></div>
<div id="toast" class="toast"></div>

<script>
/* =====================================================================
   CRT TRADING JOURNAL — Google Sheets–backed, syncs across any device
   signed into the same Google account.
   ===================================================================== */
window.CFG = {
  clientId: localStorage.getItem('crt_client_id') || '',
  sheetId: localStorage.getItem('crt_sheet_id') || '',
};
window.STATE = {
  token: sessionStorage.getItem('crt_token') || null,
  tokenExp: Number(sessionStorage.getItem('crt_token_exp') || 0),
  signedIn: false,
  tab: 'dashboard',
  trades: [],
  missed: [],
  accounts: [], // {name, ddLimit, dailyRiskCap, targetMin, targetMax}
  activeAccountFilter: 'All',
  editingRow: null, // row index (1-based incl header) of trade being edited
  editingMissedRow: null,
  loading: false,
  calYear: new Date().getFullYear(),
  calMonth: new Date().getMonth(), // 0-indexed, reset properly to EST on boot in app.js
};
</script>
<script src="app.js"></script>
</body>
</html>
